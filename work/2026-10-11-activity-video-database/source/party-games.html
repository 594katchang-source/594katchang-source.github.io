].map((g,i)=>({id:String(i+1),title:g[0],category:g[1],audience:g[2],material:g[3],players:g[4],time:g[5],note:g[6],steps:g[7].split('|'),tip:g[8]}));
let state={q:'',category:'全部類型',audience:'全部對象',material:'全部道具',only:false};let favs=JSON.parse(localStorage.getItem('party-game-favorites')||'[]');const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function option(id,first,values){$(id).innerHTML=[first,...new Set(values)].map(x=>`<option>${esc(x)}</option>`).join('')};option('#category','全部類型',games.map(x=>x.category));option('#audience','全部對象',games.map(x=>x.audience));option('#material','全部道具',games.map(x=>x.material));
function list(){return games.filter(g=>(!state.q||`${g.title} ${g.category} ${g.audience} ${g.material} ${g.note}`.toLowerCase().includes(state.q))&&(state.category==='全部類型'||g.category===state.category)&&(state.audience==='全部對象'||g.audience===state.audience)&&(state.material==='全部道具'||g.material===state.material)&&(!state.only||favs.includes(g.id)))}
function render(){const items=list();$('#count').textContent=items.length;$('#total').textContent=games.length;$('#favCount').textContent=favs.length;$('#empty').hidden=!!items.length;$('#favToggle').classList.toggle('active',state.only);$('#grid').innerHTML=items.map(g=>`<article class="card" data-id="${g.id}"><div class="card-top"><span class="cat">${esc(g.category)}</span><button class="heart ${favs.includes(g.id)?'saved':''}" data-fav="${g.id}" aria-label="收藏 ${esc(g.title)}">${favs.includes(g.id)?'★':'☆'}</button></div><h2>${esc(g.title)}</h2><p>${esc(g.note)}</p><div class="meta"><span>👥 ${esc(g.players)}</span><span>⏱ ${esc(g.time)}</span><span>🎒 ${esc(g.material)}</span></div><div class="actions"><button class="details" data-detail="${g.id}">查看玩法</button><a class="video" target="_blank" rel="noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(g.title+' party game how to play')}">影片示範 ↗</a><a class="resource" target="_blank" rel="noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(g.title+' 遊戲 玩法 規則')}">延伸玩法資料 ↗</a></div></article>`).join('');document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('party-game-favorites',JSON.stringify(favs));render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openGame(b.dataset.detail))}
function openGame(id){const g=games.find(x=>x.id===id);$('#dialogCat').textContent=g.category;$('#dialogTitle').textContent=g.title;$('#dialogInfo').innerHTML=`<span>👥 ${esc(g.players)}</span><span>⏱ ${esc(g.time)}</span><span>🎒 ${esc(g.material)}</span><span>🎯 ${esc(g.audience)}</span>`;$('#dialogNote').textContent=g.note;$('#dialogSteps').innerHTML=g.steps.map(x=>`<li>${esc(x)}</li>`).join('');$('#dialogTip').textContent=g.tip;$('#modal').hidden=false;document.body.style.overflow='hidden'}function close(){ $('#modal').hidden=true;document.body.style.overflow=''}
$('#query').oninput=e=>{state.q=e.target.value.toLowerCase();render()};['category','audience','material'].forEach(id=>$('#'+id).onchange=e=>{state[id]=e.target.value;render()});$('#favToggle').onclick=()=>{state.only=!state.only;render()};$('#clear').onclick=()=>{state={q:'',category:'全部類型',audience:'全部對象',material:'全部道具',only:false};$('#query').value='';['category','audience','material'].forEach(x=>$('#'+x).selectedIndex=0);render()};$('#random').onclick=()=>{const pool=list().length?list():games;const g=pool[Math.floor(Math.random()*pool.length)];openGame(g.id)};$('#close').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};document.onkeydown=e=>{if(e.key==='Escape')close()};render();
</script></body></html>
