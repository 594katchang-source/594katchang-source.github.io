    a{color:inherit}

    .wrap{padding:0 24px 50px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-38px;position:relative;z-index:2}
    .stat{background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
    .stat b{font-size:28px;display:block}.stat span{font-size:13px;color:var(--muted)}
    .toolbar{margin:28px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:minmax(260px,2fr) repeat(2,minmax(150px,1fr));gap:10px}
    .search{position:relative}.search input{padding-left:40px}.search:before{content:"⌕";position:absolute;left:14px;top:8px;font-size:22px;color:var(--muted)}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(184,95,61,.12)}
    .actionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0;flex-wrap:wrap}
    .result{color:var(--muted);font-size:14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink);font-weight:700}
    .btn:hover{border-color:#c89f87;background:#fff6ed}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.primary:hover{background:#9e4e32}.btn.danger{color:var(--red)}

    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;display:flex;flex-direction:column;min-height:305px;transition:.18s;position:relative}
    .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .card-top{display:flex;justify-content:space-between;gap:10px}.region{font-size:12px;font-weight:900;letter-spacing:.06em;padding:5px 9px;border-radius:99px;background:var(--mint);color:var(--green)}

</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">DAY CARE ACTIVITY LIBRARY</div>
      <h1>日照活動靈感庫</h1>
      <p>精選台灣、日本與歐美以長者活動示範、團康遊戲、認知訓練與樂齡運動為主的 YouTube 頻道。找活動，直接看做法。</p>
    </div>
  </header>
  <main class="wrap">
    <section class="stats">
      <div class="stat"><b id="statTotal">30</b><span>收錄頻道</span></div>
      <div class="stat"><b id="statRegions">3</b><span>地區分類</span></div>
      <div class="stat"><b id="statFav">0</b><span>我的收藏</span></div>
    </section>

    <section class="toolbar" aria-label="資料篩選">
      <div class="search"><input id="q" type="search" placeholder="搜尋頻道、活動、特色或語言…"></div>
      <select id="region"><option value="">所有地區</option><option>台灣</option><option>日本</option><option>歐美</option></select>
      <select id="category"><option value="">所有活動</option></select>
    </section>

    <div class="actionbar">
      <div class="result" id="resultText"></div>
      <div class="actions">
        <button class="btn" id="resetBtn">重設篩選</button>
        <button class="btn" id="exportBtn">匯出 JSON</button>
        <label class="btn" for="importFile">匯入 JSON</label><input id="importFile" type="file" accept=".json,application/json" hidden>
        <button class="btn primary" id="addBtn">＋ 新增頻道</button>
      </div>
    </div>

    <section class="grid" id="grid"></section>
    <aside class="notice">
      <strong>使用提醒：</strong>本清單優先收錄「多數影片可作為活動示範或教案靈感」的頻道，查核日期為 2026-06-20。帶領體能活動前，請依長輩身體狀況及跌倒風險調整。日本、英文內容可使用 YouTube 自動字幕與翻譯。
    </aside>
  </main>

  <dialog id="editor">
    <div class="modal-head"><h3 id="modalTitle">新增頻道</h3><button class="close" type="button" id="closeBtn">×</button></div>
    <form id="channelForm">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="field"><label for="name">頻道名稱 *</label><input id="name" required></div>
        <div class="field"><label for="country">國家／地區 *</label><input id="country" required placeholder="例如：台灣"></div>
        <div class="field"><label for="formRegion">分類地區 *</label><select id="formRegion" required><option>台灣</option><option>日本</option><option>歐美</option></select></div>
        <div class="field"><label for="language">語言</label><input id="language" placeholder="繁中／日文／英文"></div>
        <div class="field full"><label for="url">YouTube 頻道網址 *</label><input id="url" type="url" required></div>
        <div class="field full"><label for="categories">活動分類</label><input id="categories" placeholder="用逗號分隔，例如：體適能, 認知訓練, 團康"></div>
        <div class="field full"><label for="description">內容特色</label><textarea id="description" rows="3"></textarea></div>
        <div class="field full"><label for="note">管理備註</label><textarea id="note" rows="2"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn" hidden>刪除</button><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary" type="submit">儲存</button></div>
    </form>
  </dialog>

  <footer>資料僅作教案探索與內部管理使用；頻道內容與名稱可能隨時間調整。所有商標與影片版權屬原作者。</footer>

  {id:"we03",region:"歐美",country:"澳洲",name:"Golden Carers",url:"https://www.youtube.com/c/goldencarers",language:"英文",directness:"直接教案",popularity:"中高",categories:["活動企劃","手作","節慶活動","行事曆"],description:"專為 activity coordinator 與 recreation therapist 提供活動靈感、規劃工具和主題日曆。",note:"YouTube 約 3 千訂閱；網站資源量更大，部分需付費。"},
  {id:"we04",region:"歐美",country:"美國",name:"SeniorShape Fitness",url:"https://www.youtube.com/@SeniorShapeFitness",language:"英文",directness:"直接教案",popularity:"高",categories:["椅子運動","肌力","瑜伽","有氧"],description:"高品質高齡與初學者跟練課程，坐姿、有氧、肌力、伸展均有清楚分級與替代動作。",note:"適合體適能時段；使用穩固無輪椅子。"},
  {id:"we05",region:"歐美",country:"美國",name:"yes2next",url:"https://www.youtube.com/c/yes2next",language:"英文",directness:"直接教案",popularity:"高",categories:["低衝擊運動","平衡","肌力","步行"],description:"由教練與高齡母親共同示範，氣氛溫暖且常提供坐姿替代；具大型熟齡運動受眾。",note:"約 60 萬級訂閱的熱門頻道（2026 年媒體資料）。"},

  {id:"we08",region:"歐美",country:"澳洲",name:"Memory Lane Therapy",url:"https://www.youtube.com/@memorylanetherapy",language:"英文",directness:"直接教案",popularity:"中高",categories:["懷舊問答","認知訓練","手作","團康遊戲"],description:"所有內容都圍繞高齡活動，包括電視歌曲猜謎、企鵝投擲、穿線遊戲和節慶手作。",note:"適合認知、懷舊與簡易桌面活動。"},

  {id:"we10",region:"歐美",country:"美國",name:"Elder Care Services, Inc.",url:"https://www.youtube.com/@eldercareservicesinc.2726",language:"英文",directness:"直接教案",popularity:"特色",categories:["失智活動","節慶手作","感官刺激","生活功能"],description:"「Engaging Activities for Seniors」系列示範失智長者可做的節慶裝飾、簡易料理與感官手作。",note:"規模較小，但活動對象明確且步驟實用。"}
];

const KEY="daycare-youtube-db-v3", FAVKEY="daycare-youtube-favs-v3";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
let favs=new Set(JSON.parse(localStorage.getItem(FAVKEY)||"[]"));
const $=s=>document.querySelector(s);
const grid=$("#grid"), editor=$("#editor");

function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(FAVKEY,JSON.stringify([...favs]));}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function allCategories(){return [...new Set(data.flatMap(x=>x.categories||[]))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));}
function buildCategories(){const now=$("#category").value;$("#category").innerHTML='<option value="">所有活動</option>'+allCategories().map(x=>`<option ${x===now?"selected":""}>${esc(x)}</option>`).join("");}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(),r=$("#region").value,c=$("#category").value;
  return data.filter(x=>{
    const hay=[x.name,x.country,x.language,x.description,x.note,...(x.categories||[])].join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(!r||x.region===r)&&(!c||(x.categories||[]).includes(c));
  });
}
function render(){
  const rows=filtered();
  $("#resultText").textContent=`顯示 ${rows.length} / ${data.length} 個頻道`;
  grid.innerHTML=rows.length?rows.map(x=>`
    <article class="card">
      <div class="card-top"><span class="region">${esc(x.region)}・${esc(x.country)}</span></div>
      <button class="fav ${favs.has(x.id)?"on":""}" title="收藏" data-fav="${esc(x.id)}">★</button>
      <h2>${esc(x.name)}</h2>
      <div class="meta">${esc(x.language)}</div>
      <p class="desc">${esc(x.description)}</p>
      <div class="tags">${(x.categories||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="card-actions"><a class="btn primary small" href="${esc(x.url)}" target="_blank" rel="noopener">開啟 YouTube ↗</a><button class="btn small" data-edit="${esc(x.id)}">編輯</button></div>
    </article>`).join(""):`<div class="empty">找不到符合條件的頻道。試著清除部分篩選，或新增自己的資料。</div>`;
  $("#statTotal").textContent=data.length;
  $("#statRegions").textContent=new Set(data.map(x=>x.region)).size;
  $("#statFav").textContent=favs.size;
  grid.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{favs.has(b.dataset.fav)?favs.delete(b.dataset.fav):favs.add(b.dataset.fav);save();render()});
  grid.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
}
function openEditor(id=""){
  const x=data.find(v=>v.id===id);
  $("#modalTitle").textContent=x?"編輯頻道":"新增頻道";
  $("#editId").value=x?.id||"";$("#name").value=x?.name||"";$("#country").value=x?.country||"";
  $("#formRegion").value=x?.region||"台灣";$("#language").value=x?.language||"";$("#url").value=x?.url||"";
  $("#categories").value=(x?.categories||[]).join(", ");$("#description").value=x?.description||"";$("#note").value=x?.note||"";
  $("#deleteBtn").hidden=!x;editor.showModal();
}
function closeEditor(){editor.close()}
["q","region","category"].forEach(id=>$("#"+id).addEventListener(id==="q"?"input":"change",render));
$("#resetBtn").onclick=()=>{["q","region","category"].forEach(id=>$("#"+id).value="");render()};
$("#addBtn").onclick=()=>openEditor();$("#closeBtn").onclick=closeEditor;$("#cancelBtn").onclick=closeEditor;
editor.addEventListener("click",e=>{if(e.target===editor)closeEditor()});
$("#channelForm").onsubmit=e=>{
  e.preventDefault();const id=$("#editId").value||"custom-"+Date.now();
  const x={id,name:$("#name").value.trim(),country:$("#country").value.trim(),region:$("#formRegion").value,language:$("#language").value.trim(),
    url:$("#url").value.trim(),directness:"直接教案",popularity:"特色",
    categories:$("#categories").value.split(/[,，]/).map(v=>v.trim()).filter(Boolean),description:$("#description").value.trim(),note:$("#note").value.trim()};
  const i=data.findIndex(v=>v.id===id);i>=0?data.splice(i,1,x):data.unshift(x);save();buildCategories();render();closeEditor();
};
$("#deleteBtn").onclick=()=>{
  const id=$("#editId").value;if(!id||!confirm("確定刪除此頻道？"))return;
  data=data.filter(x=>x.id!==id);favs.delete(id);save();buildCategories();render();closeEditor();
};
$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),channels:data,favorites:[...favs]},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="日照活動頻道資料庫.json";a.click();URL.revokeObjectURL(a.href);
};
$("#importFile").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{const obj=JSON.parse(await file.text()),rows=Array.isArray(obj)?obj:obj.channels;if(!Array.isArray(rows))throw Error();
    data=rows;favs=new Set(obj.favorites||[]);save();buildCategories();render();alert(`已匯入 ${data.length} 筆資料。`);
  }catch{alert("匯入失敗：檔案不是有效的資料庫 JSON。")}e.target.value="";
};
buildCategories();render();
</script>
</body>
</html>
