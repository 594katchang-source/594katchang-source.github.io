
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長者手工藝教案資料庫</title>
<style>
:root{
  --orange:#E8552D;--amber:#F4A93C;--teal:#028090;--ink:#12343B;
  --paper:#FBF6EC;--paper2:#F3EBDB;--line:#E2D6BE;--text:#2B2B2B;--muted:#6B6259;
  --r:14px;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--paper);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;line-height:1.6}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--teal)}

/* header */
header{background:var(--ink);color:#fff;padding:22px 20px 18px}
.hwrap{max-width:1180px;margin:0 auto}
h1{margin:0;font-size:1.8rem;letter-spacing:.04em;font-weight:700}
h1 small{display:block;font-size:.95rem;font-weight:400;color:#C9DCE0;margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:1rem}
.stats b{color:var(--amber);font-size:1.4rem;margin-right:4px}
.searchrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.searchrow input{flex:1;min-width:220px;font-size:1.1rem;padding:12px 16px;border-radius:var(--r);border:2px solid transparent;background:#fff;color:var(--text)}
.searchrow input:focus{outline:none;border-color:var(--amber)}
.btn{border:none;border-radius:var(--r);padding:12px 18px;font-weight:700;background:var(--amber);color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:2px solid #fff;color:#fff}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* filters */
.filters{max-width:1180px;margin:0 auto;padding:16px 20px 0}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.flabel{font-weight:700;color:var(--ink);margin-right:4px;white-space:nowrap}
.chip{border:2px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:6px 14px;font-size:.95rem;line-height:1.3}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.cat.on{background:var(--orange);border-color:var(--orange)}
.chip.fav.on{background:var(--orange);border-color:var(--orange)}
.chip .n{opacity:.65;font-size:.85em;margin-left:3px}
.resultbar{max-width:1180px;margin:0 auto;padding:6px 20px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted)}
.resultbar select{font-size:1rem;padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:#fff;font-family:inherit}

/* grid */
.grid{max-width:1180px;margin:0 auto;padding:14px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;position:relative;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
.card .e{font-size:2.4rem;line-height:1}
.card h3{margin:4px 0 0;font-size:1.2rem;color:var(--ink);line-height:1.3}
.card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.card .cat{color:var(--orange);font-weight:700}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.card .tags span{background:var(--paper2);border-radius:6px;padding:2px 8px;font-size:.82rem;color:var(--ink)}
.heart{position:absolute;top:10px;right:10px;background:none;border:none;font-size:1.6rem;line-height:1;padding:6px;border-radius:50%;color:#C8BBA5}
.heart.on{color:var(--orange)}
.heart:hover{background:var(--paper2)}
.diff{letter-spacing:2px;color:var(--amber)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:1.1rem}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(18,52,59,.6);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;padding:26px 28px 30px;position:relative;margin:auto}
.modal .e{font-size:3rem;line-height:1}
.modal h2{margin:6px 0 4px;font-size:1.7rem;color:var(--ink)}
.modal .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);margin-bottom:8px}
.modal .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modal .tags span{background:var(--paper2);border-radius:6px;padding:3px 10px;font-size:.9rem;color:var(--ink)}
.sec{margin-top:16px}
.sec h4{margin:0 0 6px;font-size:1.05rem;color:var(--teal);border-left:5px solid var(--teal);padding-left:10px}
.sec ul,.sec ol{margin:0;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ol li::marker{color:var(--orange);font-weight:700}
.sec.goal{background:var(--paper);border-radius:12px;padding:12px 16px}
.sec.goal h4{border-color:var(--amber);color:var(--ink)}
.sec.ad h4{border-color:var(--orange);color:var(--orange)}
.mactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.mactions .btn{text-decoration:none;display:inline-block}
.close{position:absolute;top:12px;right:14px;background:var(--paper2);border:none;width:42px;height:42px;border-radius:50%;font-size:1.3rem}
.videohint{color:var(--muted);font-size:.9rem;margin-top:8px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

footer{text-align:center;color:var(--muted);font-size:.9rem;padding:20px}

@media (max-width:600px){
  html{font-size:17px}
  #ftoggle{display:inline-block!important}
  .filters{display:none}
  .filters.show{display:block}
  header{padding:16px 14px}
  h1{font-size:1.45rem}
  .filters,.grid,.resultbar{padding-left:12px;padding-right:12px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:12px}
  .card .e{font-size:2rem}
  .card h3{font-size:1.05rem}
  .card .tags span:nth-child(n+3){display:none}
  .modal{padding:20px 16px 26px}
  .modal h2{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  header,.filters,.resultbar,.grid,footer,.close,.mactions,.toast{display:none!important}
  .overlay{position:static;display:block!important;background:none;padding:0}
  .modal{box-shadow:none;max-width:none;padding:0}
  body{background:#fff}
  html{font-size:15px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>長者手工藝教案資料庫<small>社區據點、日照、居家活動帶領者的手作活動工具箱</small></h1>
  <div class="stats"><span><b id="stTotal">0</b>個教案</span><span><b id="stCat">0</b>個分類</span><span><b id="stFav">0</b>個收藏</span></div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="搜尋名稱、材料、標籤…（例：毛線、失智、端午）" aria-label="搜尋教案">
    <button class="btn" id="btnRandom">🎲 今天做什麼？</button>
    <button class="btn ghost" id="btnClear">清除篩選</button>
  </div>
</div></header>

<button class="btn teal" id="ftoggle" style="display:none;margin:12px 12px 0">篩選條件 ▾</button>
<section class="filters" id="filters">
  <div class="frow"><span class="flabel">分類</span><div id="cats" style="display:contents"></div></div>
  <div class="frow"><span class="flabel">標籤</span><div id="tags" style="display:contents"></div></div>
  <div class="frow"><span class="flabel">難度</span>
    <button class="chip lv" data-l="1">★ 入門</button><button class="chip lv" data-l="2">★★ 中等</button><button class="chip lv" data-l="3">★★★ 挑戰</button>
    <span class="flabel" style="margin-left:14px">時間</span>
    <button class="chip tm" data-m="30">30 分內</button><button class="chip tm" data-m="45">45 分內</button>
    <span class="flabel" style="margin-left:14px">收藏</span>
    <button class="chip fav" id="favOnly">❤️ 只看我的最愛</button>
  </div>
</section>
<div class="resultbar"><span id="count"></span>
  <span>排序 <select id="sort"><option value="id">分類順序</option><option value="l">難度由低到高</option><option value="m">時間由短到長</option><option value="n">名稱筆畫</option></select>
  <button class="chip" id="btnExport">📋 匯出收藏</button><button class="chip" id="btnImport">📥 匯入收藏</button></span>
</div>
<main class="grid" id="grid"></main>
<footer>愛迪樂健康促進團隊｜職能治療觀點的長者活動設計。點選教案卡可看完整步驟、帶領重點與影片搜尋。</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const CRAFTS = [

{id:3,n:"春節剪紙窗花",c:"紙藝",e:"✂️",t:["精細動作","懷舊","節慶","認知刺激"],l:2,m:40,g:"小組",mat:["紅色薄紙","安全剪刀","窗花圖樣紙型","鉛筆"],s:["正方形紅紙對摺三次成三角形","依圖樣描線後沿線剪出缺口","小心攤開，欣賞對稱花樣","貼在窗戶或透明夾上展示"],goal:"剪刀操作訓練手部肌力與雙側協調；對稱概念刺激空間認知。",ad:"手抖者用較大圖樣、少摺一次；可用撕紙代替剪紙。",yt:"剪紙 窗花 簡單 教學"},

const CAT_ORDER=["紙藝","繪畫著色","布藝","編織","黏土陶藝","自然素材","節慶民俗","生活實用","回收再利用","珠飾串珠","懷舊多媒材"];
const TAG_ORDER=["失智友善","精細動作","認知刺激","懷舊","社交互動","情緒放鬆","感官刺激","創造表達","可送禮","節慶","生活實用","回收利用","自然素材","坐姿完成","專注力","家庭互動","肌力"];
const LV=["","★","★★","★★★"];
const state={q:"",cat:null,tags:new Set(),lv:null,tm:null,favOnly:false,sort:"id"};
const KEY="craftdb_favs_v1";
let mem=[];
function loadFavs(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return mem}}
function saveFavs(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
let favs=new Set(loadFavs());
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveFavs([...favs]);toast(favs.has(id)?"已加入我的最愛 ❤️":"已移除收藏");render();if($("#overlay").classList.contains("open"))openDetail(id,true)}

function buildChips(){
  const cc={};CRAFTS.forEach(c=>cc[c.c]=(cc[c.c]||0)+1);
  $("#cats").innerHTML=CAT_ORDER.map(c=>`<button class="chip cat" data-c="${c}">${c}<span class="n">${cc[c]}</span></button>`).join("");
  const tc={};CRAFTS.forEach(c=>c.t.forEach(t=>tc[t]=(tc[t]||0)+1));
  $("#tags").innerHTML=TAG_ORDER.filter(t=>tc[t]).map(t=>`<button class="chip tag" data-t="${t}">${t}<span class="n">${tc[t]}</span></button>`).join("");
  document.querySelectorAll(".chip.cat").forEach(b=>b.onclick=()=>{state.cat=state.cat===b.dataset.c?null:b.dataset.c;render()});
  document.querySelectorAll(".chip.tag").forEach(b=>b.onclick=()=>{const t=b.dataset.t;state.tags.has(t)?state.tags.delete(t):state.tags.add(t);render()});
  document.querySelectorAll(".chip.lv").forEach(b=>b.onclick=()=>{const l=+b.dataset.l;state.lv=state.lv===l?null:l;render()});
  document.querySelectorAll(".chip.tm").forEach(b=>b.onclick=()=>{const m=+b.dataset.m;state.tm=state.tm===m?null:m;render()});
  $("#favOnly").onclick=()=>{state.favOnly=!state.favOnly;render()};
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  let list=CRAFTS.filter(c=>{
    if(state.cat&&c.c!==state.cat)return false;
    if(state.lv&&c.l!==state.lv)return false;
    if(state.tm&&c.m>state.tm)return false;
    if(state.favOnly&&!favs.has(c.id))return false;
    for(const t of state.tags)if(!c.t.includes(t))return false;
    if(q){const hay=[c.n,c.c,...c.t,...c.mat,c.goal,c.ad].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  if(state.sort==="l")list.sort((a,b)=>a.l-b.l||a.m-b.m);
  else if(state.sort==="m")list.sort((a,b)=>a.m-b.m);
  else if(state.sort==="n")list.sort((a,b)=>a.n.localeCompare(b.n,"zh-Hant-TW"));
  return list;
}
function render(){
  document.querySelectorAll(".chip.cat").forEach(b=>b.classList.toggle("on",b.dataset.c===state.cat));
  document.querySelectorAll(".chip.tag").forEach(b=>b.classList.toggle("on",state.tags.has(b.dataset.t)));
  document.querySelectorAll(".chip.lv").forEach(b=>b.classList.toggle("on",+b.dataset.l===state.lv));
  document.querySelectorAll(".chip.tm").forEach(b=>b.classList.toggle("on",+b.dataset.m===state.tm));
  $("#favOnly").classList.toggle("on",state.favOnly);
  $("#stTotal").textContent=CRAFTS.length;$("#stCat").textContent=CAT_ORDER.length;$("#stFav").textContent=favs.size;
  const list=filtered();
  $("#count").textContent=`顯示 ${list.length} 個教案`;
  if(!list.length){$("#grid").innerHTML=`<div class="empty">${state.favOnly&&!favs.size?"還沒有收藏。點卡片右上角的 ♡ 就能加入我的最愛。":"找不到符合的教案，試試放寬條件或按「清除篩選」。"}</div>`;return}
  $("#grid").innerHTML=list.map(c=>`<div class="card" tabindex="0" data-id="${c.id}" role="button" aria-label="${esc(c.n)}">
    <button class="heart ${favs.has(c.id)?"on":""}" data-fav="${c.id}" aria-label="收藏">${favs.has(c.id)?"♥":"♡"}</button>
    <div class="e">${c.e}</div><h3>${esc(c.n)}</h3>
    <div class="meta"><span class="cat">${c.c}</span><span class="diff">${LV[c.l]}</span><span>⏱ ${c.m} 分</span><span>${c.g}</span></div>
    <div class="tags">${c.t.slice(0,4).map(t=>`<span>${t}</span>`).join("")}</div></div>`).join("");
  document.querySelectorAll(".card").forEach(el=>{el.onclick=e=>{if(e.target.closest(".heart"))return;openDetail(+el.dataset.id)};el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetail(+el.dataset.id)}}});
  document.querySelectorAll(".heart").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(+b.dataset.fav)});
}
function openDetail(id,keep){
  const c=CRAFTS.find(x=>x.id===id);if(!c)return;
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(c.yt);
  $("#modal").innerHTML=`<button class="close" id="mclose" aria-label="關閉">✕</button>
    <div class="e">${c.e}</div><h2>${esc(c.n)}</h2>
    <div class="meta"><span style="color:var(--orange);font-weight:700">${c.c}</span><span class="diff">${LV[c.l]} ${["","入門","中等","挑戰"][c.l]}</span><span>⏱ 約 ${c.m} 分鐘</span><span>👥 ${c.g}</span></div>
    <div class="tags">${c.t.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="sec goal"><h4>職能治療觀點：為什麼適合長輩</h4><p style="margin:0">${esc(c.goal)}</p></div>
    <div class="sec"><h4>準備材料</h4><ul>${c.mat.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>
    <div class="sec"><h4>帶領步驟</h4><ol>${c.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
    <div class="sec ad"><h4>調整與簡化（失能／失智／手部功能較弱）</h4><p style="margin:0">${esc(c.ad)}</p></div>
    <div class="mactions">
      <button class="btn orange" id="mfav">${favs.has(c.id)?"♥ 已收藏（點此移除）":"♡ 加入我的最愛"}</button>
      <a class="btn teal" href="${yt}" target="_blank" rel="noopener">▶ 看示範影片</a>
      <button class="btn" id="mprint">🖨 列印教案</button>
    </div>
    <div class="videohint">影片按鈕會開啟 YouTube 搜尋「${esc(c.yt)}」，請挑選畫面清楚、步驟慢的示範給長輩看。</div>`;
  $("#overlay").classList.add("open");if(!keep)document.body.style.overflow="hidden";
  $("#mclose").onclick=closeDetail;$("#mfav").onclick=()=>toggleFav(c.id);$("#mprint").onclick=()=>window.print();
}
function closeDetail(){$("#overlay").classList.remove("open");document.body.style.overflow=""}
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeDetail()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
$("#q").oninput=e=>{state.q=e.target.value;render()};
$("#sort").onchange=e=>{state.sort=e.target.value;render()};
$("#btnClear").onclick=()=>{state.q="";$("#q").value="";state.cat=null;state.tags.clear();state.lv=null;state.tm=null;state.favOnly=false;render()};
$("#btnRandom").onclick=()=>{const l=filtered();const pool=l.length?l:CRAFTS;const c=pool[Math.floor(Math.random()*pool.length)];openDetail(c.id)};
$("#btnExport").onclick=()=>{if(!favs.size){toast("目前沒有收藏可以匯出");return}const names=CRAFTS.filter(c=>favs.has(c.id)).map(c=>c.n);const text="收藏代碼："+[...favs].join(",")+"\n"+names.join("、");(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast("已複製收藏清單，可貼到記事本保存")).catch(()=>prompt("請複製這段文字保存：",text))};
$("#btnImport").onclick=()=>{const s=prompt("貼上收藏代碼（例：1,25,47）：");if(!s)return;const ids=(s.match(/\d+/g)||[]).map(Number).filter(i=>CRAFTS.some(c=>c.id===i));ids.forEach(i=>favs.add(i));saveFavs([...favs]);toast(`已匯入 ${ids.length} 個收藏`);render()};
$("#ftoggle").onclick=()=>{const f=$("#filters");f.classList.toggle("show");$("#ftoggle").textContent=f.classList.contains("show")?"收合篩選 ▴":"篩選條件 ▾"};
buildChips();render();
</script>
</body>
</html>
