<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#5b3a86 0,#0a0b16 38%,#05050a 100%);color:#fff2d1;font-family:"Noto Serif TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}.wrap{width:min(1480px,calc(100vw - 24px));margin:auto;padding:22px 0 46px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px;padding:20px 22px;border:1px solid rgba(215,183,106,.28);border-radius:28px;background:rgba(255,255,255,.05);box-shadow:0 20px 80px rgba(0,0,0,.32);backdrop-filter:blur(12px)}h1{margin:0;font-size:clamp(30px,4.2vw,54px);letter-spacing:.08em}.tag{margin:0 0 8px;color:#d9ba6d;letter-spacing:.28em}.intro{margin:12px 0 0;max-width:820px;color:rgba(255,242,209,.82);line-height:1.9}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.count,input{border:1px solid rgba(215,183,106,.35);border-radius:999px;background:rgba(5,6,12,.72);color:#fff2d1;padding:12px 16px;font-size:15px}input{width:min(320px,76vw);outline:none}.hint{display:flex;justify-content:space-between;margin:0 4px 12px;color:#d9ccb2;font-size:14px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.cardbtn{border:0;padding:0;background:transparent;cursor:pointer;text-align:inherit;transition:.18s}.cardbtn:hover{transform:translateY(-6px) scale(1.015)}.card{position:relative;aspect-ratio:516/736;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#d9ba6d,#5f3c1f 34%,#f2d58a);padding:5px;box-shadow:0 16px 48px rgba(0,0,0,.42)}.inner{position:relative;height:100%;overflow:hidden;border-radius:16px;border:1px solid rgba(231,205,129,.7);background:radial-gradient(circle at center,rgba(245,211,143,.58),rgba(89,56,142,.34) 35%,rgba(8,10,24,.96) 74%),radial-gradient(circle at 20% 22%,#fff 0 1px,transparent 2px),radial-gradient(circle at 72% 16%,#fff 0 1px,transparent 2px),linear-gradient(180deg,#11162d,#060711)}.inner:before{content:"";position:absolute;inset:18px;border:1px solid rgba(215,183,106,.62);border-radius:14px}.inner:after{content:"";position:absolute;left:12%;right:12%;top:15%;bottom:19%;border:1px solid rgba(215,183,106,.26);border-radius:999px}.moon{position:absolute;left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:#d9aa42;box-shadow:0 0 18px rgba(242,213,138,.75)}.moon.top{top:16px}.moon.bot{bottom:16px}.moon:after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:#0b0d19;left:10px;top:-2px}.num{position:absolute;z-index:2;left:50%;top:7px;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff8e8;color:#34220d;border:1px solid #d8b96f;font-weight:800}.plant{position:absolute;left:18%;right:18%;top:24%;bottom:25%;display:flex;align-items:center;justify-content:center}.stem{position:absolute;width:3px;height:88%;background:#a7864c;border-radius:99px;box-shadow:0 0 18px rgba(242,213,138,.28)}.leaf{position:absolute;width:46%;height:15%;border:1px solid rgba(239,218,153,.42);border-radius:100% 10% 100% 10%;background:linear-gradient(135deg,rgba(74,129,76,.95),rgba(15,71,52,.9));box-shadow:0 12px 28px rgba(0,0,0,.28)}.leaf:nth-child(2){top:12%;left:3%;transform:rotate(-28deg)}.leaf:nth-child(3){top:25%;right:0;transform:rotate(25deg) scale(.92)}.leaf:nth-child(4){top:41%;left:0;transform:rotate(-16deg) scale(1.05)}.leaf:nth-child(5){top:56%;right:3%;transform:rotate(18deg)}.leaf:nth-child(6){top:70%;left:8%;transform:rotate(-22deg) scale(.85)}.flower{position:absolute;top:35%;width:86%;height:40%;border-radius:50%;background:radial-gradient(circle,#ffe8a6 0 9%,transparent 10%),conic-gradient(from 0deg,#d9ba6d,#f4e3af,#8d6fb1,#d9ba6d);opacity:.92;filter:drop-shadow(0 0 16px rgba(242,213,138,.22))}.name{position:absolute;z-index:3;left:20px;right:20px;bottom:44px;border-radius:999px;background:rgba(7,8,18,.7);border:1px solid rgba(215,183,106,.44);padding:7px 8px;text-align:center;color:#fff3c4;letter-spacing:.26em;font-weight:700}.modal{position:fixed;inset:0;background:rgba(4,5,11,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(10px)}.modal.open{display:flex}.viewer{width:min(1120px,96vw);height:min(840px,94vh);display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:18px;animation:flip .36s ease both}.big{height:100%}.panel{position:relative;overflow:auto;border-radius:28px;border:1px solid rgba(217,183,106,.5);background:rgba(255,250,240,.94);color:#211d17;padding:clamp(24px,4vw,50px);box-shadow:0 24px 90px rgba(0,0,0,.5);display:flex;align-items:center}.close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(217,183,106,.55);background:#0b0d19;color:#fff2d1;font-size:28px;cursor:pointer}.front{margin:auto;max-width:720px;text-align:center}.front:before,.front:after{content:"";display:block;width:120px;height:1px;background:rgba(153,112,47,.45);margin:0 auto 24px}.front:after{margin:28px auto 0}.title{font-size:clamp(34px,5vw,60px);letter-spacing:.12em;margin:0 0 24px}.desc{font-size:clamp(20px,2.4vw,30px);line-height:1.9;margin:0 0 28px}.qa{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}.box{border:1px solid rgba(153,112,47,.28);border-radius:22px;background:rgba(255,255,255,.62);padding:18px}.box h3{margin:0 0 9px;color:#7b5b24;letter-spacing:.22em}.box p{margin:0;font-size:clamp(17px,1.8vw,22px);line-height:1.85}@keyframes flip{from{transform:perspective(1200px) rotateY(75deg) scale(.9);opacity:0}to{transform:none;opacity:1}}@media(max-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:880px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(4,1fr)}.viewer{display:block}.big{display:none}.panel{height:100%}.qa{grid-template-columns:1fr}}@media(max-width:560px){.wrap{width:calc(100vw - 14px);padding-top:10px}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.card{border-radius:15px}.name{font-size:12px;letter-spacing:.16em;left:12px;right:12px}header{padding:16px;border-radius:22px}.intro{font-size:14px}}
</style>
</head>
<body>
<div class="wrap"><header><div><p class="tag">草木心語 情緒覺察卡</p><h1>36 張卡牌互動版</h1><p class="intro">首頁一次顯示 36 張卡牌背面。點選卡牌後翻面，正面說明會放大占滿畫面，方便閱讀文字。正反面用同一筆資料綁定，避免卡背植物和正面內容錯配。</p></div><div class="tools"><input id="q" placeholder="搜尋植物、主題或編號"><span class="count" id="count">36 / 36</span></div></header><div class="hint"><span>點卡牌翻面</span><span>依 PDF 正反面順序核對</span></div><main class="grid" id="grid"></main></div><div class="modal" id="modal"><div class="viewer" id="viewer"></div></div>
<script>
const cards=[
[1,'薰衣草','安定','當心裡太吵，先別急著把一切想清楚。給自己一點安靜，讓呼吸帶你慢慢回來。','你現在最需要降低的是哪一種噪音，是外在的，還是心裡的？','做三次慢吸慢吐，吸四拍，吐六拍。'],
[2,'洋甘菊','放鬆','你已經撐了很久，身體也知道。先讓肩膀和眉心鬆一點，休息可以從一個小地方開始。','你最近有多久，沒有真正放鬆下來？','閉上眼 20 秒，掃過額頭、下巴、肩膀，找到一個最緊的地方，輕輕鬆開。'],
[3,'茉莉','安撫','脆弱的時候，不用急著把自己藏起來。先陪著這份不太穩的感受，心會慢慢靜下來。','你現在最需要被理解的是哪一種感受？','把手放在胸口，對自己說一句「我有聽見你」。'],
[4,'玫瑰','自我善待','你對別人很溫柔，也留一點溫柔給自己吧。照顧自己，是很日常的練習。','你今天有沒有用太嚴格的方式對自己說話？','寫下一句你想送給自己的話。'],
[5,'檸檬香蜂草','緩和','心裡緊的時候，先不用逼自己立刻改變。把速度放慢一點，情緒才有空間落下來。','你現在最想緩下來的是哪件事？','坐好，吸氣時默數 1 到 4，吐氣時默數 1 到 6，做五輪。'],
[6,'尤加利','呼吸','當胸口悶住，世界也會跟著縮小。把注意力帶回呼吸，讓身體幫你打開一點空間。','你最近哪一刻最需要一口深呼吸？','做三次深吸氣，再把氣慢慢吐長。'],
[7,'桂花','溫暖','有些安定不是安靜，是心裡重新有了溫度。回想一個讓你覺得被照顧的片刻，讓自己待一下。','你最近一次感到被溫柔對待，是什麼時候？','想一個讓你安心的人、地方或畫面，停留 30 秒。'],
[8,'白鶴芋','安靜','不是每件事都要立刻回應。安靜一下，常常也是一種整理。','你有哪件事，今天可以先不急著回答？','給自己 1 分鐘安靜時間，不滑手機，只留意呼吸。'],
[9,'苔蘚','慢下來','慢，不代表落後。慢，是讓你真正感覺到自己還在這裡。','你今天最想放慢的是哪一個步驟？','把手邊的一件小事故意慢慢做完，例如倒水或洗杯子。'],
[10,'蕨類','休息','休息不是偷懶，是把自己放回可以繼續生活的位置。你可以先停一下。','你的累，比較像身體累，還是心累？','幫自己安排 10 分鐘不被打擾的空白時間。'],
[11,'雪松','扎根','覺得心情很飄的時候，先回到腳下。穩住身體，心也會跟著穩一點。','什麼會讓你有「站穩了」的感覺？','用你的雙腳踩地 30 秒，感受腳底和地面的接觸。'],
[12,'蓮花','接納','有些感受不需要立刻趕走。先允許它存在，心會少一點拉扯。','你現在最不想承認，卻一直在心裡的感受是什麼？','對那個感受說一句「我知道你在」。'],
[13,'迷迭香','清晰','當思緒糾結在一起，先別逼自己立刻決定。把混亂攤開來看，答案會慢慢浮出來。','眼前這件事，真正重要的是哪一部分？','把你現在在想的事寫成三句話，接著，只留下最關鍵的一句。'],
[14,'薄荷','釋放','悶住太久，心會越來越重。先透一口氣，讓卡住的地方鬆一點。','你現在最想放下的是什麼？','吐氣時想像把胸口那股悶悶的感覺送出去，重複五次。'],
[15,'鼠尾草','整理','腦袋太滿的時候，不用硬撐。先把事情分一分，心會輕一點。','你現在最需要整理的是情緒、事情，還是關係？','寫下三件掛在心上的事，圈出一件今天能處理、能有進度的。'],
[16,'羅勒','回到當下','當心一直往前跑，人就容易不留意現在。把注意力拉回此刻，很多事會沒那麼亂。','你今天有哪一刻，人在這裡，心卻不在這裡？','說出你現在看見的 3 樣東西、聽見的 2 個聲音、感覺到的 1 個身體感受。'],
[17,'百里香','提振','低迷的時候，不用逼自己振作。先點亮一個小小的動力就夠了。','你今天最需要被喚醒的是精神、信心，還是行動力？','選一件只要 5 分鐘就能完成的小事，現在去做。'],
[18,'檸檬','明亮','當心情灰灰的，先別急著質疑自己。試著把視線移向一點點亮處，哪怕很小也可以。','今天有沒有一件小事，讓你覺得還不錯？','寫下今天 3 個小小的好事。'],
[19,'香茅','清新','當心被舊情緒黏住，換一口新氣，會有不同的感覺。你可以替今天開啟一個比較清爽的起點。','你想替今天清掉的是哪一種心情殘留？','站起來伸展雙手和肩膀 30 秒，像在把悶氣甩開。'],
[20,'竹','韌性','柔軟不代表脆弱。能彎、能調整，也是一種很有力量的樣子。','最近哪件事，讓你發現自己其實比想像中更能撐？','想起一件你曾經走過的難題，寫下那時你靠什麼撐過來。'],
[21,'常春藤','連結','人在累的時候，常會想把自己關起來。其實一句問候、一個陪伴，就能讓心鬆很多。','你現在最想靠近誰，或最想被誰接住？','傳一則簡短訊息給一個讓你安心的人。'],
[22,'橄欖','和解','有些情緒耗損來自心裡一直在拉扯。放下輸贏，先回到你真正想守住的東西。','你現在最想和解的是誰，或是你自己的哪一面？','寫下一句「我願意先放下的是……」。'],
[23,'松樹','堅定','外面很亂的時候，心裡更需要一個堅定立場。你可以慢慢想清楚，什麼是你真正在乎的。','眼前這件事，你最想守住的是什麼？','寫下一句你的界線宣言，例如「我需要先照顧好自己」。'],
[24,'多肉','節制','照顧自己，有時是加一點，有時是少一點。少承接一點、多留白一點，也是一種保護。','你最近是不是答應了太多事？','找一件今天可以婉拒、延後或簡化的事。'],
[25,'金盞花','修復','修復不是一下就能好，是一點一點長回來。給自己多點時間，也給自己耐心。','你現在最需要修補的是身體、情緒，還是生活節奏？','寫下一個今天能做到的照顧行動，例如早睡 30 分鐘。'],
[26,'向日葵','希望','有些美好的事物不會立刻發光發亮。替自己留一個往光走的小方向，就很夠了。','你現在還願意相信的一件事是什麼？','寫下一個這週想靠近的小目標。'],
[27,'菊花','沉澱','情緒翻湧時，先不用急著講清楚。讓心沉澱一下，這些想說的話會更貼近自己。','你現在最需要沉一下的是哪種情緒？','倒一杯溫水，慢慢喝完，只留意水流進身體的感覺。'],
[28,'玉蘭花','柔軟','你可以堅強，也可以柔軟。很多時候，真正讓人舒服的，是不用一直撐著。','你最近在哪個時候，很想放下硬撐的樣子？','對自己說一句「我可以不用一直撐」。'],
[29,'天竺葵','平衡','當生活一頭重、一頭輕，心也會跟著歪。先看看自己的生活，哪個地方需要被拉回來。','你現在失衡的，是工作與休息、人際與獨處，還是照顧別人與照顧自己？','在紙上畫兩欄，寫下「消耗我的」和「滋養我的」。'],
[30,'洛神花','回暖','冷掉的不只是身體，有時也有心。找回一點熱度，情緒就會開始往炙熱的情緒流動。','最近什麼事讓你覺得心變冷了？','泡一杯熱飲，慢慢喝，只做享受熱飲這一件事。'],
[31,'橙花','安心','安心不是什麼事都沒發生，是你知道自己可以陪自己走一段。這份感覺，可以慢慢長出來。','什麼會讓你有被安住的感覺？','列出 3 件能讓你安心的小習慣。'],
[32,'茶樹','回神','當心很散、腦很累，先不用逼自己馬上專注。讓自己休息後再回神，比硬撐更有效。','你現在最需要回來的是精神、體力，還是注意力？','離開座位 1 分鐘，洗把臉或看看遠方。'],
[33,'肉桂','安穩','安穩的感覺常藏在熟悉的小事裡。重複那些讓你安心的節奏，會把自己慢慢帶回來。','你有哪些日常習慣，會讓心比較穩？','做一個熟悉的小儀式，例如泡茶、整理桌面、摺衣服。'],
[34,'生薑','暖身','當你覺得無力感，先別急著責怪自己或他人。讓身體暖一點，人比較容易慢慢恢復。','你最近的疲憊，是不是已經累到身體裡了？','起身走 3 分鐘，讓身體熱起來。'],
[35,'黃金葛','陪伴','有些支持很安靜，卻一直都在。想起那些默默陪伴你的人事物，心會鬆一點。','你生命裡，有哪些陪伴是你平常容易忽略的？','寫下 3 個讓你覺得有被陪著的存在。'],
[36,'龜背芋','展開','把心打開，不用一下子所有情緒都放進來。多給自己一點空間，看見新的可能就好。','你現在最想為自己打開的是哪一扇門？','寫下一個你想嘗試的新選擇，哪怕只是很小的一步。']
].map(([id,plant,theme,desc,question,practice])=>({id,plant,theme,desc,question,practice}));
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count'),modal=document.getElementById('modal'),viewer=document.getElementById('viewer');function back(c,big=false){return `<div class="card ${big?'big':''}"><div class="inner"><div class="num">${c.id}</div><div class="moon top"></div><div class="moon bot"></div><div class="plant"><div class="stem"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="flower"></div></div><div class="name">${c.plant}</div></div></div>`}function render(list){grid.innerHTML=list.map(c=>`<button class="cardbtn" type="button" data-id="${c.id}" aria-label="${c.plant}｜${c.theme}">${back(c)}</button>`).join('');count.textContent=`${list.length} / 36`}function openCard(id){const c=cards.find(x=>x.id===id);viewer.innerHTML=`<div class="big">${back(c,true)}</div><section class="panel"><button class="close">×</button><div class="front"><h2 class="title">${c.plant}｜${c.theme}</h2><p class="desc">${c.desc}</p><div class="qa"><div class="box"><h3>問題</h3><p>${c.question}</p></div><div class="box"><h3>練習</h3><p>${c.practice}</p></div></div></div></section>`;modal.classList.add('open');document.body.style.overflow='hidden'}function closeCard(){modal.classList.remove('open');document.body.style.overflow=''}grid.onclick=e=>{const b=e.target.closest('.cardbtn');if(b)openCard(Number(b.dataset.id))};q.oninput=()=>{const s=q.value.trim();render(cards.filter(c=>!s||String(c.id).includes(s)||c.plant.includes(s)||c.theme.includes(s)))};modal.onclick=e=>{if(e.target===modal||e.target.className==='close')closeCard()};document.onkeydown=e=>{if(e.key==='Escape')closeCard()};render(cards);
</script>
</body>
</html>
